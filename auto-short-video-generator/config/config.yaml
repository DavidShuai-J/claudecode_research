# 短视频自动化生成工具配置文件

# API配置（敏感信息请使用.env文件）
api:
  # LLM配置 - 支持 openai, anthropic, coze
  llm_provider: "openai"  # 使用 OpenAI
  openai_model: "gpt-4-turbo-preview"
  anthropic_model: "claude-3-opus-20240229"

  # 扣子(Coze)配置
  coze_bot_id: "7563596474257440807"  # Chat机器人ID
  coze_image_workflow_id: "7563924661450457088"  # 图像生成工作流ID
  coze_video_workflow_id: "7563925011602915364"  # 视频生成工作流ID（可选）

  # TTS配置 - 支持 edge, azure
  tts_provider: "edge"
  edge_voice: "zh-CN-YunxiNeural"  # 男声
  # edge_voice: "zh-CN-XiaoxiaoNeural"  # 女声

  # 图片生成 - 支持 dalle, coze, stable-diffusion, replicate
  image_provider: "dalle"  # 使用 DALL-E 3
  dalle_model: "dall-e-3"
  image_size: "1792x1024"  # 横屏视频适配

# 视频配置
video:
  resolution: [1080, 1920]  # 竖屏 9:16
  fps: 30
  duration_per_image: 3  # 每张图片展示秒数
  background_music: false  # 是否添加背景音乐

# 字幕配置
subtitle:
  font: "SimHei"  # 黑体
  font_size: 48
  font_color: "white"
  stroke_color: "black"
  stroke_width: 2
  position: "bottom"  # top, center, bottom
  max_chars_per_line: 20

# 文案配置
script:
  min_words: 1000
  max_words: 1500
  perspective: "second_person"  # 第二人称
  style_types:
    - "权力结构型"
    - "市井羞辱型"
    - "极端人性抉择"
    - "社会机制型"
    - "命运反转型"
    - "悬疑揭秘型"

# 标题配置
title:
  min_length: 12
  max_length: 22
  hook_types:
    - "强设问"
    - "强视觉"
    - "强悬念"
    - "强对比"
    - "强冲突"

# 输出配置
output:
  base_dir: "./output"
  keep_intermediate: true  # 保留中间文件
  video_format: "mp4"
  video_codec: "libx264"
  audio_codec: "aac"
